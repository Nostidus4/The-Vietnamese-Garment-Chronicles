# Keeps the free Render backend awake so judges never meet a cold start.
# Turn on:  Settings → Secrets and variables → Actions → Variables → New variable
#           BACKEND_URL = https://<your-service>.onrender.com   (no trailing slash)
# Turn off: delete the BACKEND_URL variable, or Actions → "Keep backend awake" → ⋯ → Disable workflow.
# Note: GitHub runs schedules only on the default branch, and may start them a few minutes late.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL is not set: nothing to ping."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 "$BACKEND_URL/health"
